# C08 / Q04 / Q05 — do not npm publish from a laptop.
# X05 gate: dry_run defaults to true. Uncheck it and tick publish_free / publish_pro.
#
# Repo secrets:
#   NPM_TOKEN          npmjs granular token (bypass 2FA) with publish on @dashflow
#   GH_PACKAGES_TOKEN  optional PAT (write:packages) if this repo is not under the dashflowx org
#                      (GITHUB_TOKEN is enough when the repo lives at github.com/dashflowx/…)

name: Publish npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and inspect only (no registry upload)
        type: boolean
        default: true
      publish_free:
        description: Publish @dashflow/core to npmjs (public)
        type: boolean
        default: false
      publish_pro:
        description: Publish @dashflow/core-pro to GitHub Packages (private)
        type: boolean
        default: false
      dist_tag:
        description: npm dist-tag for the free package
        type: choice
        default: latest
        options: [latest, next]

concurrency:
  group: publish-npm-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn lint
      - run: yarn build

      - name: First publish is 1.0.0 if the package is missing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node scripts/ensure-publish-version.mjs . https://registry.npmjs.org
          umask 077
          cat > "$RUNNER_TEMP/github.npmrc" <<EOF
          @dashflow:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/github.npmrc" \
            node scripts/ensure-publish-version.mjs core-pro https://npm.pkg.github.com

      - name: Inspect free tarball (no src/pro)
        run: node scripts/pack-inspect.mjs .

      - name: Inspect pro tarball
        run: node scripts/pack-inspect.mjs core-pro

      - name: Stop after dry-run
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry_run=true — not uploading. Re-run with dry_run unchecked and publish_free/publish_pro ticked."
          echo "Free package: @dashflow/core@$(node -p "require('./package.json').version")"
          echo "Pro package:  @dashflow/core-pro@$(node -p "require('./core-pro/package.json').version") → GitHub Packages only"

      - name: Require NPM_TOKEN for free publish
        if: ${{ !inputs.dry_run && inputs.publish_free }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::Set repository secret NPM_TOKEN (npmjs granular token with bypass 2FA)."
            exit 1
          fi

      - name: Publish @dashflow/core to npmjs
        if: ${{ !inputs.dry_run && inputs.publish_free }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          cat > "$RUNNER_TEMP/npmjs.npmrc" <<EOF
          //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          registry=https://registry.npmjs.org/
          always-auth=true
          EOF
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmjs.npmrc" \
            node scripts/ensure-publish-version.mjs . https://registry.npmjs.org
          VER="$(node -p "require('./package.json').version")"
          echo "Publishing @dashflow/core@${VER} to https://registry.npmjs.org (creates the package if it does not exist)"
          npm publish --userconfig "$RUNNER_TEMP/npmjs.npmrc" --access public --tag "${{ inputs.dist_tag }}" --ignore-scripts --provenance

      - name: Require GitHub Packages auth for Pro
        if: ${{ !inputs.dry_run && inputs.publish_pro }}
        env:
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          if [ "${{ github.repository_owner }}" != "dashflow" ] && [ "${{ github.repository_owner }}" != "dashflowx" ] && [ -z "$GH_PACKAGES_TOKEN" ]; then
            echo "::error::@dashflow/core-pro on GitHub Packages needs a GitHub owner named dashflow (scope match), or secret GH_PACKAGES_TOKEN with write:packages on that owner."
            exit 1
          fi

      - name: Publish @dashflow/core-pro to GitHub Packages
        if: ${{ !inputs.dry_run && inputs.publish_pro }}
        working-directory: core-pro
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          cat > "$RUNNER_TEMP/github.npmrc" <<EOF
          @dashflow:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
          EOF
          echo "Publishing @dashflow/core-pro to https://npm.pkg.github.com"
          npm publish --userconfig "$RUNNER_TEMP/github.npmrc" --ignore-scripts

      - name: Verify free package on npmjs
        if: ${{ !inputs.dry_run && inputs.publish_free }}
        run: npm view @dashflow/core version

      - name: Confirm Pro is not on public npmjs
        if: ${{ !inputs.dry_run && inputs.publish_pro }}
        run: |
          if npm view @dashflow/core-pro version >/dev/null 2>&1; then
            echo "::error::@dashflow/core-pro must not exist on registry.npmjs.org"
            exit 1
          fi
          echo "Pro is not listed on public npmjs (expected)."
